<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrow function</title>
</head>
<body>
    <h2>js arrow function</h2>
    <p>this example shows an aroow function with a parameter</p>
    <p id="result"></p>
    <script>
      const add = (a,b) => a + b;
      document.getElementById("result").innerHTML = add(a,b)
    </script>
</body>
</html>
